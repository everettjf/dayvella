name: Dayvella
options:
  bundleIdPrefix: com.xnu
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  knownRegions: [en, Base, zh-Hans]
settings:
  base:
    DEVELOPMENT_TEAM: YPV49M8592
    SWIFT_VERSION: 5.0
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Dayvella:
    type: application
    platform: iOS
    sources:
      - path: Dayvella
        excludes:
          - Info.plist
          - Dayvella.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xnu.countmydays
        PRODUCT_NAME: $(TARGET_NAME)
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: 116
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Dayvella/Dayvella.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dayvella
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: 1,2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    dependencies:
      - target: DayvellaWidget
        embed: true
  DayvellaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DayvellaWidget
        excludes:
          - Info.plist
          - DayvellaWidget.entitlements
    info:
      path: DayvellaWidget/Info.plist
      properties:
        CFBundleDisplayName: Dayvella Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xnu.countmydays.widget
        PRODUCT_NAME: $(TARGET_NAME)
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: 116
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: DayvellaWidget/DayvellaWidget.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1,2
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
schemes:
  Dayvella:
    build:
      targets:
        Dayvella: all
        DayvellaWidget: all
    run:
      config: Debug
    archive:
      config: Release
