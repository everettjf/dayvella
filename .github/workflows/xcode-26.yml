name: Xcode 26 compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xcode-26-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode ${{ matrix.xcode }}
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        xcode: ['26.0.1', '26.3']
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Confirm toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Build simulator app and widget
        run: >-
          xcodebuild -project Dayvella.xcodeproj -scheme Dayvella
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/dayvella-build"
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Build release app and widget
        run: >-
          xcodebuild -project Dayvella.xcodeproj -scheme Dayvella
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/dayvella-release"
          CODE_SIGNING_ALLOWED=NO build
      - name: Run core tests
        run: swift test
      - name: Validate compiled localizations
        run: python3 scripts/validate_localizations.py --build-dir "$RUNNER_TEMP/dayvella-build"
